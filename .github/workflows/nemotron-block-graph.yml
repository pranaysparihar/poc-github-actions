name: Nemotron exact implicit block graph
on:
  pull_request:
    paths:
      - 'block_graph/**'
      - '.github/workflows/nemotron-block-graph.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HF_HOME: ${{ github.workspace }}/.hf-cache
      HF_HUB_ENABLE_HF_TRANSFER: '1'
    steps:
      - uses: actions/checkout@v4
      - run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: block_graph/requirements.txt
      - uses: actions/cache@v4
        with:
          path: .hf-cache
          key: nemotron-3-embed-1b-bf16-0677b2025cbc
      - run: python -m pip install -r block_graph/requirements.txt
      - run: |
          mkdir -p results
          python block_graph/probe.py --block-words 256 --max-blocks 60000 --bucket-history 24 --output results/block-graph.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nemotron-block-graph
          path: results/
          retention-days: 7
