name: Nemotron coupled SwiGLU neuron probe
on:
  pull_request:
    paths:
      - 'nemotron_lossless_lab/mlp_neuron_probe.py'
      - '.github/workflows/nemotron-mlp-neurons.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mlp-neurons:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_HOME: ${{ github.workspace }}/.hf-cache
      HF_HUB_ENABLE_HF_TRANSFER: '1'
    steps:
      - uses: actions/checkout@v4
      - run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: nemotron_lossless_lab/requirements.txt
      - uses: actions/cache@v4
        with:
          path: .hf-cache
          key: nemotron-3-embed-1b-bf16-0677b2025cbc
      - run: python -m pip install -r nemotron_lossless_lab/requirements.txt
      - run: |
          mkdir -p results
          python nemotron_lossless_lab/mlp_neuron_probe.py --layers 4 --output results/mlp-neurons.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nemotron-mlp-neurons
          path: results/
          retention-days: 7
